<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Clarvis</title>
  <desc id="description">Direct coding agents. Inspect every decision.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0B16"/>
      <stop offset="1" stop-color="#171433"/>
    </linearGradient>
    <linearGradient id="mark" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6D66F0"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#D0C4FF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#background)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1070" cy="80" r="240" fill="#6D66F0" fill-opacity="0.11" filter="url(#glow)"/>
  <circle cx="110" cy="360" r="150" fill="#A78BFA" fill-opacity="0.07" filter="url(#glow)"/>

  <g transform="translate(76 104) scale(4.25)">
    <circle cx="24" cy="24" r="14" stroke="url(#mark)" stroke-width="3" opacity="0.5"/>
    <g fill="url(#mark)">
      <circle cx="23.6" cy="22.6" r="4.7"/>
      <path d="M28 24C28 27.6 25.4 30.9 21.4 31.4C24 29.5 25.7 26.4 24.9 23.2Z"/>
    </g>
    <circle cx="24" cy="10" r="3.6" fill="#6D66F0"/>
    <circle cx="36.12" cy="31" r="3.6" fill="#8B85F5"/>
    <circle cx="11.88" cy="31" r="3.6" fill="#A78BFA"/>
  </g>

  <text x="310" y="88" fill="#B3AFFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="3">CLARVIS</text>
  <text x="310" y="164" fill="#F2F1F8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="720" letter-spacing="-2.4">Direct coding agents.</text>
  <text x="310" y="224" fill="#B3AFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="720" letter-spacing="-2.4">Inspect every decision.</text>
  <text x="312" y="271" fill="#AAA8B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="460">Prompts · plans · tools · diffs · delegation · memory · approvals</text>

  <line x1="310" y1="314" x2="1118" y2="314" stroke="#E0DEFF" stroke-opacity="0.13"/>
  <text x="310" y="352" fill="#C7C5D3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" letter-spacing="1.4">TERMINAL WORKSPACE FOR CODING AGENTS</text>
  <g transform="translate(982 331)">
    <rect width="136" height="31" rx="15.5" fill="#A29CF6" fill-opacity="0.12" stroke="#B3AFFF" stroke-opacity="0.38"/>
    <circle cx="18" cy="15.5" r="4" fill="#B3AFFF"/>
    <text x="31" y="20" fill="#F2F1F8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.1">PUBLIC BETA</text>
  </g>
</svg>
