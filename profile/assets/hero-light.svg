<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Clarvis</title>
  <desc id="description">Direct coding agents. Inspect every decision.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFBFD"/>
      <stop offset="1" stop-color="#F1F1F8"/>
    </linearGradient>
    <linearGradient id="mark" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B54E8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#26234B" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#background)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="23.25" stroke="#26234B" stroke-opacity="0.12" stroke-width="1.5"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1070" cy="80" r="240" fill="#5650D8" fill-opacity="0.10" filter="url(#glow)"/>
  <circle cx="110" cy="360" r="150" fill="#A78BFA" fill-opacity="0.08" filter="url(#glow)"/>

  <g transform="translate(76 104) scale(4.25)">
    <circle cx="24" cy="24" r="14" stroke="url(#mark)" stroke-width="3" opacity="0.45"/>
    <g fill="url(#mark)">
      <circle cx="23.6" cy="22.6" r="4.7"/>
      <path d="M28 24C28 27.6 25.4 30.9 21.4 31.4C24 29.5 25.7 26.4 24.9 23.2Z"/>
    </g>
    <circle cx="24" cy="10" r="3.6" fill="#6D66F0"/>
    <circle cx="36.12" cy="31" r="3.6" fill="#8B85F5"/>
    <circle cx="11.88" cy="31" r="3.6" fill="#A78BFA"/>
  </g>

  <text x="310" y="88" fill="#5650D8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="3">CLARVIS</text>
  <text x="310" y="164" fill="#191827" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="720" letter-spacing="-2.4">Direct coding agents.</text>
  <text x="310" y="224" fill="#5650D8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="52" font-weight="720" letter-spacing="-2.4">Inspect every decision.</text>
  <text x="312" y="271" fill="#56546A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="460">Prompts · plans · tools · diffs · delegation · memory · approvals</text>

  <line x1="310" y1="314" x2="1118" y2="314" stroke="#26234B" stroke-opacity="0.13"/>
  <text x="310" y="352" fill="#56546A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" letter-spacing="1.4">TERMINAL WORKSPACE FOR CODING AGENTS</text>
  <g transform="translate(982 331)">
    <rect width="136" height="31" rx="15.5" fill="#5650D8" fill-opacity="0.08" stroke="#5650D8" stroke-opacity="0.30"/>
    <circle cx="18" cy="15.5" r="4" fill="#5650D8"/>
    <text x="31" y="20" fill="#191827" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.1">PUBLIC BETA</text>
  </g>
</svg>
